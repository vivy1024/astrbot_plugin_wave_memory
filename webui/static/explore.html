<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Memory · 神经云图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/3.0.2/sigma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: {
            nebula: { 900:'#06080d', 800:'#0a0e17', 700:'#0f141e', 600:'#1a1f2e' },
            glow: { purple:'#8b5cf6', blue:'#3b82f6', dim:'rgba(139,92,246,0.25)' }
        }}}
    }
    </script>
    <style>
    * { box-sizing: border-box; }
    body { background: #06080d; overflow: hidden; margin: 0; }
    #sigma-container { position: fixed; inset: 0; z-index: 1; }

    /* Ambient nebula background (behind canvas) */
    #nebula-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .nebula-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; mix-blend-mode: screen; }
    .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, #7c3aed, transparent 70%); top: -10%; left: -5%; }
    .orb-2 { width: 520px; height: 520px; background: radial-gradient(circle, #2563eb, transparent 70%); bottom: -10%; right: -5%; }
    .orb-3 { width: 440px; height: 440px; background: radial-gradient(circle, #db2777, transparent 70%); top: 40%; left: 55%; opacity: 0.25; }
    #grid-overlay {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.4;
        background-image: linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 40%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 40%, transparent 100%);
    }

    /* Glass panels */
    .glass {
        background: rgba(10, 14, 23, 0.78);
        backdrop-filter: blur(20px) saturate(1.3);
        border: 1px solid rgba(139, 92, 246, 0.12);
        box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    /* Gradient hairline border accent */
    .glass-accent { position: relative; }
    .glass-accent::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
        background: linear-gradient(135deg, rgba(139,92,246,0.5), rgba(59,130,246,0.15) 40%, transparent 70%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    .topbar {
        background: rgba(6, 8, 13, 0.82);
        backdrop-filter: blur(24px) saturate(1.3);
        border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        box-shadow: 0 4px 30px rgba(0,0,0,0.55);
    }
    .brand-text {
        background: linear-gradient(135deg, #a78bfa, #60a5fa 60%, #f472b6);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: brand-shimmer 6s ease infinite;
    }
    @keyframes brand-shimmer { 0%,100% { background-position: 0% center; } 50% { background-position: 100% center; } }

    /* Tab buttons */
    .tab-btn { color: #64748b; border: 1px solid transparent; }
    .tab-btn.active {
        background: rgba(139, 92, 246, 0.12);
        color: #a78bfa;
        border-color: rgba(139, 92, 246, 0.25);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.1);
    }
    .tab-btn:hover:not(.active) { color: #94a3b8; background: rgba(255,255,255,0.03); }

    /* Tooltip */
    .node-tooltip {
        position: fixed;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.15s ease, transform 0.15s ease;
        max-width: 320px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(6, 8, 13, 0.97);
        border: 1px solid rgba(139, 92, 246, 0.3);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), 0 8px 32px rgba(0,0,0,0.6);
    }
    .node-tooltip.visible { opacity: 1; transform: translateY(0); }
    .node-tooltip .tt-name {
        font-size: 13px; font-weight: 600; color: #f1f5f9;
        margin-bottom: 4px;
    }
    .node-tooltip .tt-type {
        display: inline-block;
        font-size: 10px; font-weight: 500;
        padding: 2px 8px; border-radius: 99px;
        margin-bottom: 6px;
    }
    .node-tooltip .tt-meta {
        font-size: 11px; color: #94a3b8; line-height: 1.5;
    }
    .node-tooltip .tt-neighbors {
        font-size: 10px; color: #64748b; margin-top: 6px;
        border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;
    }

    /* Legend pills */
    .legend-pill { transition: all 0.2s ease; }
    .legend-pill:hover { transform: scale(1.08); }
    .legend-pill.active {
        transform: scale(1.12);
        box-shadow: 0 0 16px var(--pill-glow);
    }

    /* Detail panel */
    .detail-panel {
        scrollbar-width: thin;
        scrollbar-color: rgba(139,92,246,0.2) transparent;
    }
    .detail-panel::-webkit-scrollbar { width: 4px; }
    .detail-panel::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.25); border-radius: 2px; }

    /* Person list items */
    .person-item {
        padding: 8px 12px; border-radius: 8px; cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
    }
    .person-item:hover {
        background: rgba(139, 92, 246, 0.06);
        border-color: rgba(139, 92, 246, 0.15);
    }

    /* Scrollbar global */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.2); border-radius: 3px; }

    /* Animations */
    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 12px rgba(139,92,246,0.1); }
        50% { box-shadow: 0 0 20px rgba(139,92,246,0.25); }
    }
    </style>
</head>
<body class="text-slate-200 font-sans">
    <div id="nebula-bg">
        <div class="nebula-orb orb-1"></div>
        <div class="nebula-orb orb-2"></div>
        <div class="nebula-orb orb-3"></div>
    </div>
    <div id="grid-overlay"></div>
    <div id="sigma-container"></div>
    <div id="node-tooltip" class="node-tooltip"></div>

    <!-- Top Bar -->
    <div class="fixed top-0 inset-x-0 z-30 topbar flex items-center gap-3 px-5 py-2.5">
        <a href="/" class="text-slate-400 text-xs px-3 py-1.5 rounded-md border border-white/5 hover:text-white hover:border-glow-dim transition">← 管理面板</a>
        <button onclick="toggleKgConfig()" class="text-slate-400 text-xs px-3 py-1.5 rounded-md border border-white/5 hover:text-white hover:border-glow-dim transition">⚙ 配置</button>
        <span class="brand-text font-semibold text-sm">⚡ 知识图谱</span>
        <div class="ml-auto flex gap-1" id="view-tabs">
            <button data-view="galaxy" class="tab-btn active px-3 py-1.5 rounded-md text-xs transition">星图</button>
            <button data-view="query" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">联想</button>
            <button data-view="person" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">人物</button>
            <button data-view="path" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">路径</button>
            <a href="/maintain" class="px-3 py-1.5 rounded-md text-xs text-amber-400/80 border border-amber-400/20 hover:bg-amber-400/10 transition">🔧 维护</a>
        </div>
    </div>

    <!-- KG Config Panel -->
    <div id="kg-config" class="fixed top-12 left-4 z-20 glass glass-accent rounded-xl p-4 w-72 hidden" style="max-height:calc(100vh - 80px); overflow-y:auto">
        <h4 class="text-slate-400 text-[10px] uppercase tracking-widest mb-3">图谱配置</h4>
        <div class="space-y-3">
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">显示节点数</label>
                <input type="number" id="cfg-max-nodes" min="10" max="5000" value="200" class="w-full px-2 py-1.5 bg-nebula-700 border border-white/10 rounded-md text-[11px] text-slate-300">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">最小关联强度</label>
                <input type="number" id="cfg-min-weight" min="0" max="10" step="0.1" value="0" class="w-full px-2 py-1.5 bg-nebula-700 border border-white/10 rounded-md text-[11px] text-slate-300">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">时间范围</label>
                <select id="cfg-days" class="w-full px-2 py-1.5 bg-nebula-700 border border-white/10 rounded-md text-[10px] text-slate-300">
                    <option value="0">全部时间</option>
                    <option value="7">最近 7 天</option>
                    <option value="30">最近 30 天</option>
                    <option value="90">最近 90 天</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-2">数据图层（勾选加载到图谱）</label>
                <div class="space-y-1.5" id="cfg-layers">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked data-layer="facts" class="accent-purple-500"> <span class="text-[10px] text-slate-300">事实关系</span> <span class="text-[9px] text-slate-600">facts+tag_relations</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" data-layer="beliefs" class="accent-purple-500"> <span class="text-[10px] text-slate-300">信念</span> <span class="text-[9px] text-slate-600">bot 的判断/认知</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" data-layer="concerns" class="accent-purple-500"> <span class="text-[10px] text-slate-300">关切</span> <span class="text-[9px] text-slate-600">bot 当前关注焦点</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" data-layer="jargon" class="accent-purple-500"> <span class="text-[10px] text-slate-300">黑话</span> <span class="text-[9px] text-slate-600">群内暗语/梗</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" data-layer="affinity" class="accent-purple-500"> <span class="text-[10px] text-slate-300">好感度</span> <span class="text-[9px] text-slate-600">bot→人物 好感关系</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" data-layer="communities" class="accent-purple-500"> <span class="text-[10px] text-slate-300">社区</span> <span class="text-[9px] text-slate-600">tag 共现聚类</span></label>
                </div>
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">关系类型（点击取消=隐藏该类）</label>
                <div id="cfg-rel-types" class="flex flex-wrap gap-1"></div>
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">节点类型（点击取消=隐藏该类）</label>
                <div id="cfg-node-types" class="flex flex-wrap gap-1"></div>
            </div>
            <button onclick="loadGalaxy()" class="w-full px-3 py-2 bg-glow-purple/80 hover:bg-glow-purple rounded-lg text-white text-[11px] font-medium transition mt-2">应用配置</button>
            <div class="text-[9px] text-slate-600 text-center" id="cfg-status"></div>
        </div>
    </div>

    <!-- Search Box -->
    <div id="search-box" class="fixed top-14 left-1/2 -translate-x-1/2 z-20 hidden items-center gap-2">
        <input id="search-input" type="text" placeholder="输入查询，开始联想..."
            class="w-80 px-4 py-2.5 bg-nebula-700 border border-glow-dim rounded-lg text-sm text-slate-200 outline-none focus:border-glow-purple transition">
        <button onclick="doQuery()" class="px-5 py-2.5 bg-glow-purple/80 hover:bg-glow-purple rounded-lg text-white text-xs font-medium transition">联想</button>
    </div>

    <!-- Path Input -->
    <div id="path-input" class="fixed top-14 left-1/2 -translate-x-1/2 z-20 hidden items-center gap-2 glass rounded-xl px-4 py-2.5">
        <input id="path-from" type="text" placeholder="起点 Tag"
            class="w-32 px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-xs text-slate-200 outline-none">
        <span class="text-slate-500 text-xs">→</span>
        <input id="path-to" type="text" placeholder="终点 Tag"
            class="w-32 px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-xs text-slate-200 outline-none">
        <button onclick="doPathFind()" class="px-4 py-2 bg-glow-purple/70 hover:bg-glow-purple rounded-md text-white text-xs transition">寻路</button>
    </div>

    <!-- Person Panel -->
    <div id="person-panel" class="fixed top-12 left-0 bottom-0 w-64 z-20 glass border-r border-white/5 overflow-y-auto p-4 hidden">
        <h4 class="text-slate-500 text-[10px] uppercase tracking-widest mb-3">人物列表</h4>
        <div id="person-list"></div>
    </div>

    <!-- Detail Panel -->
    <div id="detail-panel" class="fixed right-4 top-16 bottom-4 w-96 z-20 glass glass-accent rounded-2xl overflow-hidden hidden detail-panel">
        <div class="p-5 h-full overflow-y-auto">
            <div class="flex items-start justify-between mb-3">
                <div>
                    <h3 id="detail-title" class="text-white text-sm font-semibold">-</h3>
                    <p id="detail-meta" class="text-slate-500 text-[11px] mt-1">-</p>
                </div>
                <button onclick="hideDetail()" class="w-7 h-7 flex items-center justify-center rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs transition">✕</button>
            </div>
            <div id="detail-neighbors" class="mb-3">
                <p class="text-slate-500 text-[10px] uppercase tracking-wider mb-2">关联节点</p>
                <div id="detail-neighbor-list" class="flex flex-wrap gap-1"></div>
            </div>
            <div id="detail-memories" class="border-t border-white/5 pt-3">
                <p class="text-slate-500 text-[10px] uppercase tracking-wider mb-2">关联记忆</p>
                <div id="detail-memory-list" class="space-y-2.5 max-h-[60vh] overflow-y-auto"></div>
            </div>
            <div class="flex gap-2 mt-4 flex-wrap">
                <button id="btn-expand" onclick="expandNode()" class="px-3 py-1.5 bg-glow-purple/10 border border-glow-dim rounded-lg text-purple-300 text-[11px] hover:bg-glow-purple/20 transition">展开社区</button>
                <button id="btn-timeline" onclick="loadTimeline()" class="px-3 py-1.5 bg-blue-500/10 border border-blue-500/20 rounded-lg text-blue-300 text-[11px] hover:bg-blue-500/20 transition">📅 时间线</button>
                <button onclick="editEntity()" class="px-3 py-1.5 bg-amber-500/10 border border-amber-500/20 rounded-lg text-amber-300 text-[11px] hover:bg-amber-500/20 transition">✏️ 修正</button>
                <button id="btn-sever-fact" onclick="severFactRelation()" class="px-3 py-1.5 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-[11px] hover:bg-red-500/20 transition">🗑 斩断关联</button>
            </div>
        </div>
    </div>

    <!-- Stats Badge -->
    <div id="stats-badge" class="fixed bottom-4 left-4 z-20 glass rounded-lg px-3 py-2 text-[11px] text-slate-500">0 节点 · 0 连线</div>

    <!-- Legend -->
    <div id="legend" class="fixed bottom-4 right-4 z-20 glass rounded-xl px-4 py-3 flex flex-wrap gap-2 max-w-xs"></div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 z-50 hidden items-center justify-center bg-nebula-900/95 flex-col gap-4">
        <div class="w-9 h-9 border-3 border-glow-purple/20 border-t-glow-purple rounded-full animate-spin"></div>
        <p id="loading-text" class="text-slate-400 text-sm">加载中...</p>
    </div>

    <!-- 修正事实三元组弹窗 -->
    <div id="fact-edit-dialog" class="fixed inset-0 z-50 hidden items-center justify-center" style="background:rgba(0,0,0,0.6); backdrop-filter:blur(3px)">
        <div class="glass glass-accent rounded-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-white">修正事实三元组</h3>
                <button onclick="closeFactEdit()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="px-5 py-4 space-y-3.5 text-xs">
                <div>
                    <label class="text-slate-500 block mb-1">主键实体 (Subject)</label>
                    <input type="text" id="edit-fact-subject" class="w-full px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-slate-200 outline-none focus:border-glow-purple">
                </div>
                <div>
                    <label class="text-slate-500 block mb-1">关系谓词 (Predicate)</label>
                    <input type="text" id="edit-fact-predicate" class="w-full px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-slate-200 outline-none focus:border-glow-purple">
                </div>
                <div>
                    <label class="text-slate-500 block mb-1">客体实体 (Object)</label>
                    <input type="text" id="edit-fact-object" class="w-full px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-slate-200 outline-none focus:border-glow-purple">
                </div>
                <div>
                    <label class="text-slate-500 block mb-1">置信度 (Confidence 0-1)</label>
                    <input type="number" step="0.1" min="0" max="1" id="edit-fact-confidence" class="w-full px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-slate-200 outline-none focus:border-glow-purple">
                </div>
            </div>
            <div class="px-5 py-4 border-t border-white/5 flex justify-end gap-2">
                <button onclick="closeFactEdit()" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 text-[11px] transition">取消</button>
                <button onclick="saveFactEdit()" class="px-4 py-1.5 rounded-lg bg-glow-purple/80 hover:bg-glow-purple text-white text-[11px] font-medium transition">保存修正</button>
            </div>
        </div>
    </div>

<script src="/static/kg.js"></script>
<script src="/static/kg-config.js"></script>
<script>
initLegend();
initGraph();
switchView('galaxy');

// ─── GSAP 入场编排 + 环境动效 ───
if (typeof gsap !== 'undefined') {
    // 星云球体缓慢漂移（无限循环）
    gsap.to('.orb-1', { x: 80, y: 50, scale: 1.15, duration: 18, ease: 'sine.inOut', repeat: -1, yoyo: true });
    gsap.to('.orb-2', { x: -70, y: -40, scale: 1.1, duration: 22, ease: 'sine.inOut', repeat: -1, yoyo: true });
    gsap.to('.orb-3', { x: -50, y: 60, scale: 1.2, duration: 26, ease: 'sine.inOut', repeat: -1, yoyo: true });

    // 入场时间线：顶栏 → 画布 → 角标 → 图例（clearProps 确保动画后恢复可见，避免 from 残留隐藏）
    const intro = gsap.timeline({ defaults: { ease: 'power3.out', clearProps: 'opacity,visibility,transform' } });
    intro.from('.topbar', { y: -60, autoAlpha: 0, duration: 0.6 })
         .from('#view-tabs > *', { y: -12, autoAlpha: 0, duration: 0.4, stagger: 0.06 }, '-=0.3')
         .from('#sigma-container', { autoAlpha: 0, scale: 1.04, duration: 0.9, ease: 'power2.out' }, '-=0.3')
         .from('#stats-badge', { x: -24, autoAlpha: 0, duration: 0.5 }, '-=0.5')
         .from('#legend', { y: 24, autoAlpha: 0, duration: 0.5 }, '-=0.4')
         .from('#legend > *', { scale: 0, autoAlpha: 0, duration: 0.35, stagger: 0.04, ease: 'back.out(2)' }, '-=0.3');
}
</script>
</body>
</html>
