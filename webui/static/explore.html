<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Memory · 神经云图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/3.0.2/sigma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: {
            nebula: { 900:'#0a0e17', 800:'#0f141e', 700:'#1a1f2e', 600:'#252b3d' },
            glow: { purple:'#8b5cf6', dim:'rgba(139,92,246,0.3)' }
        }}}
    }
    </script>
    <style>
    body { background: #0a0e17; overflow: hidden; }
    #sigma-container { position: fixed; inset: 0; z-index: 0; }
    .glass { background: rgba(15,20,30,0.88); backdrop-filter: blur(12px); border: 1px solid rgba(139,92,246,0.12); }
    .legend-pill { transition: all 0.2s; }
    .legend-pill.active { ring: 2px; transform: scale(1.1); box-shadow: 0 0 12px rgba(139,92,246,0.4); }
    .legend-pill:hover { transform: scale(1.05); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 2px; }
    </style>
</head>
<body class="text-slate-200 font-sans">
    <div id="sigma-container"></div>

    <!-- Top Bar -->
    <div class="fixed top-0 inset-x-0 z-30 glass border-b border-white/5 flex items-center gap-3 px-5 py-2.5">
        <a href="/" class="text-slate-400 text-xs px-3 py-1.5 rounded-md border border-white/5 hover:text-white hover:border-glow-dim transition">← 管理面板</a>
        <span class="text-glow-purple font-semibold text-sm">⚡ 神经云图</span>
        <div class="ml-auto flex gap-1" id="view-tabs">
            <button data-view="galaxy" class="tab-btn active px-3 py-1.5 rounded-md text-xs transition">星图</button>
            <button data-view="query" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">联想</button>
            <button data-view="person" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">人物</button>
            <button data-view="path" class="tab-btn px-3 py-1.5 rounded-md text-xs transition">路径</button>
        </div>
    </div>

    <!-- Search Box -->
    <div id="search-box" class="fixed top-14 left-1/2 -translate-x-1/2 z-20 hidden items-center gap-2">
        <input id="search-input" type="text" placeholder="输入查询，开始联想..."
            class="w-80 px-4 py-2.5 bg-nebula-800 border border-glow-dim rounded-lg text-sm text-slate-200 outline-none focus:border-glow-purple transition">
        <button onclick="doQuery()" class="px-5 py-2.5 bg-glow-purple/80 hover:bg-glow-purple rounded-lg text-white text-xs font-medium transition">联想</button>
    </div>

    <!-- Path Input -->
    <div id="path-input" class="fixed top-14 left-1/2 -translate-x-1/2 z-20 hidden items-center gap-2 glass rounded-xl px-4 py-2.5">
        <input id="path-from" type="text" placeholder="起点 Tag"
            class="w-32 px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-xs text-slate-200 outline-none">
        <span class="text-slate-500 text-xs">→</span>
        <input id="path-to" type="text" placeholder="终点 Tag"
            class="w-32 px-3 py-2 bg-nebula-700 border border-white/10 rounded-md text-xs text-slate-200 outline-none">
        <button onclick="doPathFind()" class="px-4 py-2 bg-glow-purple/70 hover:bg-glow-purple rounded-md text-white text-xs transition">寻路</button>
    </div>

    <!-- Person Panel -->
    <div id="person-panel" class="fixed top-12 left-0 bottom-0 w-64 z-20 glass border-r border-white/5 overflow-y-auto p-4 hidden">
        <h4 class="text-slate-500 text-[10px] uppercase tracking-widest mb-3">人物列表</h4>
        <div id="person-list"></div>
    </div>

    <!-- Detail Panel -->
    <div id="detail-panel" class="fixed right-4 top-24 bottom-4 w-80 z-20 glass rounded-xl p-5 overflow-y-auto hidden">
        <h3 id="detail-title" class="text-white text-sm font-medium">-</h3>
        <p id="detail-meta" class="text-slate-500 text-[11px] mt-1">-</p>
        <div id="detail-tags" class="flex flex-wrap gap-1.5 mt-3"></div>
        <div id="detail-content" class="text-slate-400 text-xs leading-relaxed whitespace-pre-wrap max-h-64 overflow-y-auto border-t border-white/5 pt-3 mt-3"></div>
        <div class="flex gap-2 mt-4 flex-wrap">
            <button id="btn-expand" onclick="expandNode()" class="px-3 py-1.5 bg-glow-purple/15 border border-glow-dim rounded-md text-purple-300 text-[11px] hover:bg-glow-purple/30 transition">展开邻居</button>
            <button onclick="hideDetail()" class="px-3 py-1.5 bg-white/5 border border-white/10 rounded-md text-slate-400 text-[11px] hover:text-white transition">关闭</button>
        </div>
    </div>

    <!-- Stats Badge -->
    <div id="stats-badge" class="fixed bottom-4 left-4 z-20 glass rounded-lg px-3 py-2 text-[11px] text-slate-500">0 节点 · 0 连线</div>

    <!-- Legend (clickable) -->
    <div id="legend" class="fixed bottom-4 right-4 z-20 glass rounded-xl px-4 py-3 flex flex-wrap gap-2 max-w-xs"></div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 z-50 hidden items-center justify-center bg-nebula-900/95 flex-col gap-4">
        <div class="w-9 h-9 border-3 border-glow-purple/20 border-t-glow-purple rounded-full animate-spin"></div>
        <p id="loading-text" class="text-slate-400 text-sm">加载中...</p>
    </div>

<script>
// ═══════════════════════════════════════════════════════════
// Wave Memory 神经云图 v3 — Sigma.js + Graphology
// ═══════════════════════════════════════════════════════════

const TYPE_COLORS = {
    person:'#f472b6', topic:'#60a5fa', event:'#34d399',
    emotion:'#fbbf24', entity:'#fb923c', keyword:'#94a3b8',
    fact:'#a78bfa', location:'#2dd4bf', time:'#e879f9',
    memory:'#6366f1', source:'#ffd700',
};
const TYPE_LABELS = {
    person:'人物', topic:'话题', event:'事件',
    emotion:'情绪', entity:'实体', keyword:'关键词',
    fact:'事实', location:'地点', time:'时间',
    memory:'记忆', source:'查询源',
};

let renderer = null;
let graph = null;
let currentView = 'galaxy';
let selectedNode = null;
let activeFilter = null; // 当前筛选的类型
let hoveredNode = null;
let hoveredNeighbors = new Set();

// ─── Legend 初始化 ───
function initLegend() {
    const legend = document.getElementById('legend');
    const types = ['person','topic','event','emotion','entity','keyword'];
    legend.innerHTML = types.map(t => `
        <button class="legend-pill flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] cursor-pointer border border-transparent hover:border-white/20"
                data-type="${t}" style="background:${TYPE_COLORS[t]}22; color:${TYPE_COLORS[t]}">
            <span class="w-2 h-2 rounded-full" style="background:${TYPE_COLORS[t]}"></span>
            ${TYPE_LABELS[t]}
        </button>
    `).join('');
    legend.querySelectorAll('.legend-pill').forEach(btn => {
        btn.addEventListener('click', () => toggleFilter(btn.dataset.type));
    });
}

function toggleFilter(type) {
    if (activeFilter === type) {
        activeFilter = null;
    } else {
        activeFilter = type;
    }
    // 更新 pill 样式
    document.querySelectorAll('.legend-pill').forEach(btn => {
        const isActive = btn.dataset.type === activeFilter;
        btn.classList.toggle('active', isActive);
        btn.style.borderColor = isActive ? TYPE_COLORS[type] : 'transparent';
    });
    renderer.refresh();
}

// ─── Graph 初始化 ───
function initGraph() {
    graph = new graphology.Graph();
    const container = document.getElementById('sigma-container');

    renderer = new Sigma(graph, container, {
        allowInvalidContainer: true,
        renderLabels: true,
        labelFont: 'system-ui, sans-serif',
        labelSize: 11,
        labelColor: { color: '#e2e8f0' },
        labelRenderedSizeThreshold: 6,
        defaultNodeColor: '#94a3b8',
        defaultEdgeColor: 'rgba(139,92,246,0.15)',
        edgeReducer(edge, data) {
            const res = { ...data };
            if (hoveredNode) {
                const src = graph.source(edge);
                const tgt = graph.target(edge);
                if (src !== hoveredNode && tgt !== hoveredNode) {
                    res.color = 'rgba(139,92,246,0.03)';
                } else {
                    res.color = 'rgba(139,92,246,0.7)';
                    res.size = 2;
                }
            }
            if (activeFilter) {
                const src = graph.source(edge);
                const tgt = graph.target(edge);
                const srcType = graph.getNodeAttribute(src, 'nodeType');
                const tgtType = graph.getNodeAttribute(tgt, 'nodeType');
                if (srcType !== activeFilter && tgtType !== activeFilter) {
                    res.color = 'rgba(139,92,246,0.02)';
                }
            }
            return res;
        },
        nodeReducer(node, data) {
            const res = { ...data };
            if (hoveredNode) {
                if (node === hoveredNode) {
                    res.highlighted = true;
                    res.zIndex = 2;
                } else if (hoveredNeighbors.has(node)) {
                    res.zIndex = 1;
                } else {
                    res.color = res.color + '33';
                    res.label = '';
                    res.zIndex = 0;
                }
            }
            if (activeFilter) {
                const nodeType = graph.getNodeAttribute(node, 'nodeType');
                if (nodeType !== activeFilter) {
                    res.color = '#334155';
                    res.size = Math.max(2, (res.size || 4) * 0.5);
                    res.label = '';
                }
            }
            return res;
        },
    });

    // 事件
    renderer.on('enterNode', ({ node }) => {
        hoveredNode = node;
        hoveredNeighbors = new Set(graph.neighbors(node));
        renderer.refresh();
        container.style.cursor = 'pointer';
    });
    renderer.on('leaveNode', () => {
        hoveredNode = null;
        hoveredNeighbors.clear();
        renderer.refresh();
        container.style.cursor = 'grab';
    });
    renderer.on('clickNode', ({ node }) => {
        selectedNode = node;
        showDetail(node);
    });
    renderer.on('clickStage', () => {
        hideDetail();
        selectedNode = null;
    });

    // ─── 中键拖拽 ───
    let midDrag = false, midStartX = 0, midStartY = 0, midStartCamera = null;
    container.addEventListener('mousedown', (e) => {
        if (e.button === 1) { // 中键
            e.preventDefault();
            midDrag = true;
            midStartX = e.clientX;
            midStartY = e.clientY;
            midStartCamera = renderer.getCamera().getState();
            container.style.cursor = 'grabbing';
        }
    });
    document.addEventListener('mousemove', (e) => {
        if (!midDrag) return;
        const camera = renderer.getCamera();
        const dx = e.clientX - midStartX;
        const dy = e.clientY - midStartY;
        const ratio = midStartCamera.ratio / container.offsetWidth;
        camera.setState({
            x: midStartCamera.x - dx * ratio,
            y: midStartCamera.y - dy * ratio,
        });
    });
    document.addEventListener('mouseup', (e) => {
        if (e.button === 1 && midDrag) {
            midDrag = false;
            container.style.cursor = 'grab';
        }
    });
    // 阻止中键默认滚动行为
    container.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });
    container.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
}

// ─── 数据加载 ───
function loadGraphData(nodes, edges) {
    graph.clear();
    const nodeIds = new Set();
    nodes.forEach(n => {
        if (nodeIds.has(String(n.id))) return;
        nodeIds.add(String(n.id));
        const color = n.isSource ? TYPE_COLORS.source : (TYPE_COLORS[n.type] || TYPE_COLORS.keyword);
        const size = n.isSource ? 12 : Math.max(4, Math.sqrt(n.degree || 1) * 3);
        graph.addNode(String(n.id), {
            label: n.name || String(n.id),
            x: Math.random() * 100,
            y: Math.random() * 100,
            size,
            color,
            nodeType: n.type || 'keyword',
            // 存储额外数据
            _data: n,
        });
    });
    edges.forEach(e => {
        const src = String(e.source);
        const tgt = String(e.target);
        if (!graph.hasNode(src) || !graph.hasNode(tgt)) return;
        if (graph.hasEdge(src, tgt) || graph.hasEdge(tgt, src)) return;
        graph.addEdge(src, tgt, {
            size: Math.max(0.5, (e.weight || 0.3) * 2),
            color: 'rgba(139,92,246,0.18)',
        });
    });

    // ForceAtlas2 布局
    if (graph.order > 0) {
        try {
            const settings = graphologyLibrary.layoutForceAtlas2.inferSettings(graph);
            settings.gravity = 1;
            settings.scalingRatio = 5;
            graphologyLibrary.layoutForceAtlas2.assign(graph, {
                iterations: 80,
                settings,
            });
        } catch(e) { console.warn('FA2 layout failed:', e); }
    }

    updateStats();
    // 适应视口
    setTimeout(() => {
        const camera = renderer.getCamera();
        camera.animatedReset({ duration: 300 });
    }, 100);
}

function appendGraphData(newNodes, newEdges) {
    const existingIds = new Set();
    graph.forEachNode(n => existingIds.add(n));

    newNodes.forEach(n => {
        const nid = String(n.id);
        if (existingIds.has(nid)) return;
        existingIds.add(nid);
        const color = n.isSource ? TYPE_COLORS.source : (TYPE_COLORS[n.type] || TYPE_COLORS.keyword);
        const size = n.isSource ? 12 : Math.max(4, Math.sqrt(n.degree || 1) * 3);
        // 放在选中节点附近
        const selPos = selectedNode ? { x: graph.getNodeAttribute(selectedNode, 'x'), y: graph.getNodeAttribute(selectedNode, 'y') } : { x: 50, y: 50 };
        graph.addNode(nid, {
            label: n.name || nid,
            x: selPos.x + (Math.random() - 0.5) * 20,
            y: selPos.y + (Math.random() - 0.5) * 20,
            size, color,
            nodeType: n.type || 'keyword',
            _data: n,
        });
    });
    newEdges.forEach(e => {
        const src = String(e.source);
        const tgt = String(e.target);
        if (!graph.hasNode(src) || !graph.hasNode(tgt)) return;
        if (graph.hasEdge(src, tgt) || graph.hasEdge(tgt, src)) return;
        graph.addEdge(src, tgt, {
            size: Math.max(0.5, (e.weight || 0.3) * 2),
            color: 'rgba(139,92,246,0.18)',
        });
    });

    // 增量布局
    try {
        const settings = graphologyLibrary.layoutForceAtlas2.inferSettings(graph);
        graphologyLibrary.layoutForceAtlas2.assign(graph, { iterations: 30, settings });
    } catch(e) {}
    updateStats();
}

// ─── Views ───
async function loadGalaxy() {
    showLoading('正在加载记忆星图全貌...');
    try {
        const res = await fetch('/api/explore/galaxy');
        const data = await res.json();
        loadGraphData(data.nodes, data.edges);
        hideLoading();
    } catch(e) { hideLoading(); console.error(e); }
}

async function doQuery() {
    const text = document.getElementById('search-input').value.trim();
    if (!text) return;
    showLoading(`正在联想 "${text}" 的记忆星图...`);
    try {
        const res = await fetch('/api/query', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ text, top_k: 12, enable_spike: true, enable_pyramid: true }),
        });
        const data = await res.json();
        const results = data.results || [];
        const sourceNode = { id:'SOURCE', name: text.slice(0,20), type:'source', isSource:true, degree: results.length };
        const nodes = [sourceNode];
        const edges = [];
        results.forEach(r => {
            const nid = `mem-${r.memory_id}`;
            nodes.push({
                id: nid, name: (r.sender_name||'').slice(0,6)+': '+(r.content||'').slice(0,18),
                type:'memory', degree:1, content: r.content, sender: r.sender_name, score: r.score, memId: r.memory_id,
            });
            edges.push({ source:'SOURCE', target: nid, weight: r.score });
        });
        loadGraphData(nodes, edges);
        hideLoading();
    } catch(e) { hideLoading(); console.error(e); }
}

async function loadPersonList() {
    try {
        const res = await fetch('/api/explore/persons?limit=50');
        const persons = await res.json();
        const list = document.getElementById('person-list');
        list.innerHTML = '';
        persons.forEach(p => {
            const div = document.createElement('div');
            div.className = 'flex justify-between items-center px-3 py-2 rounded-md cursor-pointer text-xs hover:bg-glow-purple/10 transition';
            div.innerHTML = `<span class="text-slate-300">${p.name||p.id}</span><span class="text-slate-600">${p.count} 条</span>`;
            div.onclick = () => loadPersonGraph(p.id, p.name);
            list.appendChild(div);
        });
    } catch(e) { console.error(e); }
}

async function loadPersonGraph(qqId, name) {
    showLoading(`加载 ${name} 的记忆网络...`);
    try {
        const res = await fetch(`/api/explore/person/${qqId}?max_memories=80`);
        const data = await res.json();
        const nodes = data.nodes.map(n => ({
            id: n.id, name: n.name, type: n.type||'memory',
            degree:1, content: n.content, sender: n.sender, memId: n.memId, tagId: n.tagId,
        }));
        nodes.unshift({ id:`person-${qqId}`, name, type:'person', isSource:true, degree: nodes.length });
        const edges = data.edges.map(e => ({ source: e.source, target: e.target, weight: e.weight }));
        data.nodes.filter(n => n.type==='memory').forEach(n => {
            edges.push({ source:`person-${qqId}`, target: n.id, weight:0.3 });
        });
        loadGraphData(nodes, edges);
        hideLoading();
    } catch(e) { hideLoading(); console.error(e); }
}

async function doPathFind() {
    const fromName = document.getElementById('path-from').value.trim();
    const toName = document.getElementById('path-to').value.trim();
    if (!fromName || !toName) return;
    showLoading(`寻找 "${fromName}" → "${toName}" 的路径...`);
    try {
        const [t1Res, t2Res] = await Promise.all([
            fetch('/api/tags?search='+encodeURIComponent(fromName)+'&size=1'),
            fetch('/api/tags?search='+encodeURIComponent(toName)+'&size=1'),
        ]);
        const t1 = await t1Res.json();
        const t2 = await t2Res.json();
        const fromId = (t1.items||t1)?.[0]?.id;
        const toId = (t2.items||t2)?.[0]?.id;
        if (!fromId || !toId) { hideLoading(); alert('未找到对应 Tag'); return; }

        const res = await fetch('/api/explore/path', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ source_id: fromId, target_id: toId, max_depth: 6 }),
        });
        const data = await res.json();
        if (!data.nodes || data.nodes.length === 0) { hideLoading(); alert(data.message||'未找到路径'); return; }
        const nodes = data.nodes.map(n => ({ id: n.id, name: n.name, type: n.type, degree:3 }));
        const edges = data.edges.map(e => ({ source: e.source, target: e.target, weight: e.weight||0.5 }));
        loadGraphData(nodes, edges);
        hideLoading();
    } catch(e) { hideLoading(); console.error(e); }
}

async function expandNode() {
    if (!selectedNode) return;
    const attrs = graph.getNodeAttributes(selectedNode);
    const nodeData = attrs._data || {};

    if (nodeData.tagId || typeof nodeData.id === 'number') {
        const tagId = nodeData.tagId || nodeData.id;
        showLoading(`展开 "${attrs.label}" 的邻居...`);
        try {
            const res = await fetch(`/api/tags/${tagId}/memories?size=20`);
            const mems = await res.json();
            const newNodes = []; const newEdges = [];
            (mems.items||mems||[]).forEach(m => {
                const nid = `mem-${m.id||m.memory_id}`;
                newNodes.push({ id: nid, name:(m.sender_name||'').slice(0,6)+': '+(m.content||'').slice(0,18), type:'memory', degree:1, content:m.content, sender:m.sender_name });
                newEdges.push({ source: selectedNode, target: nid, weight:0.5 });
            });
            appendGraphData(newNodes, newEdges);
            hideLoading();
        } catch(e) { hideLoading(); }
    } else if (nodeData.content) {
        showLoading(`从 "${attrs.label}" 继续联想...`);
        try {
            const res = await fetch('/api/query', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ text: nodeData.content.slice(0,200), top_k:8, enable_spike:true }),
            });
            const data = await res.json();
            const newNodes = []; const newEdges = [];
            (data.results||[]).forEach(r => {
                const nid = `mem-${r.memory_id}`;
                newNodes.push({ id: nid, name:(r.sender_name||'').slice(0,6)+': '+(r.content||'').slice(0,18), type:'memory', degree:1, content:r.content, sender:r.sender_name, score:r.score });
                newEdges.push({ source: selectedNode, target: nid, weight: r.score||0.5 });
            });
            appendGraphData(newNodes, newEdges);
            hideLoading();
        } catch(e) { hideLoading(); }
    }
}

// ─── Detail Panel ───
function showDetail(nodeId) {
    const attrs = graph.getNodeAttributes(nodeId);
    const data = attrs._data || {};
    const panel = document.getElementById('detail-panel');
    document.getElementById('detail-title').textContent = attrs.label || nodeId;
    let meta = '';
    if (data.type) meta += `类型: ${TYPE_LABELS[data.type]||data.type}`;
    if (data.degree) meta += ` · 度数: ${data.degree}`;
    if (data.score) meta += ` · 相似度: ${data.score.toFixed(4)}`;
    if (data.community !== undefined) meta += ` · 社区: #${data.community}`;
    document.getElementById('detail-meta').textContent = meta;
    document.getElementById('detail-content').textContent = data.content || '';
    document.getElementById('btn-expand').style.display = data.isSource ? 'none' : '';
    panel.classList.remove('hidden');
}
function hideDetail() {
    document.getElementById('detail-panel').classList.add('hidden');
}

// ─── Utils ───
function updateStats() {
    document.getElementById('stats-badge').textContent = `${graph.order} 节点 · ${graph.size} 连线`;
}
function showLoading(text) {
    document.getElementById('loading-text').textContent = text;
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('loading').classList.add('flex');
}
function hideLoading() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loading').classList.remove('flex');
}

// ─── View Switching ───
function switchView(view) {
    currentView = view;
    document.querySelectorAll('.tab-btn').forEach(b => {
        const isActive = b.dataset.view === view;
        b.classList.toggle('active', isActive);
        b.style.background = isActive ? 'rgba(139,92,246,0.15)' : '';
        b.style.color = isActive ? '#8b5cf6' : '#64748b';
        b.style.borderColor = isActive ? 'rgba(139,92,246,0.3)' : 'transparent';
    });
    document.getElementById('search-box').classList.toggle('hidden', view !== 'query');
    document.getElementById('search-box').style.display = view === 'query' ? 'flex' : 'none';
    document.getElementById('path-input').classList.toggle('hidden', view !== 'path');
    document.getElementById('path-input').style.display = view === 'path' ? 'flex' : 'none';
    document.getElementById('person-panel').classList.toggle('hidden', view !== 'person');
    hideDetail();
    selectedNode = null;
    activeFilter = null;
    document.querySelectorAll('.legend-pill').forEach(b => {
        b.classList.remove('active');
        b.style.borderColor = 'transparent';
    });

    if (view === 'galaxy') loadGalaxy();
    else if (view === 'person') { loadPersonList(); graph.clear(); renderer.refresh(); }
    else if (view === 'query') { graph.clear(); renderer.refresh(); }
    else if (view === 'path') { graph.clear(); renderer.refresh(); }
}

// ─── Init ───
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
});
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key==='Enter') doQuery(); });

initLegend();
initGraph();
switchView('galaxy');
</script>
</body>
</html>
